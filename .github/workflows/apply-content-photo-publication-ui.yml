name: Apply ContentINKA publication UI patch

on:
  push:
    branches:
      - codex/content-photo-publication-ui
    paths:
      - .github/workflows/apply-content-photo-publication-ui.yml

permissions:
  contents: write

jobs:
  patch-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply patch
        run: node scripts/apply-content-photo-publication-ui.mjs

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Commit generated UI changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/TattoDiary.tsx src/index.css
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Route Instagram sharing by publication set"
          git push origin HEAD:codex/content-photo-publication-ui
