name: Build durable content jobs

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  build:
    if: github.head_ref == 'feature/durable-content-jobs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/durable-content-jobs
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply implementation
        run: |
          base64 -d .github/scripts/apply_durable_content_jobs.py.gz.b64 | gzip -d > /tmp/apply_durable_content_jobs.py
          python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/apply_durable_content_jobs.py')
          source = path.read_text()
          needle = "    count = text.count(old)\n    if count != 1:\n"
          replacement = (
              "    count = text.count(old)\n"
              "    if label == 'approve button refresh guard' and count == 2:\n"
              "        return text.replace(old, new, 1)\n"
              "    if count != 1:\n"
          )
          if source.count(needle) != 1:
              raise RuntimeError('replace_once helper shape changed')
          path.write_text(source.replace(needle, replacement, 1))
          PY
          python /tmp/apply_durable_content_jobs.py

      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: git diff --check

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: recover POSTiNKA jobs after reload"
          git push origin HEAD:feature/durable-content-jobs
