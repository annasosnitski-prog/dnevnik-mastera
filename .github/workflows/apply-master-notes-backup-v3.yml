name: Apply master notes backup v3 patch

on:
  push:
    branches:
      - safety/master-notes-backup-v3

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: git apply --check .github/patches/master-notes-backup-v3.patch && git apply .github/patches/master-notes-backup-v3.patch
      - name: Remove temporary automation files
        run: rm .github/patches/master-notes-backup-v3.patch .github/workflows/apply-master-notes-backup-v3.yml
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Добавить задачи мастера в полный backup v3"
          git push
