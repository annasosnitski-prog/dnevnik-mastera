name: Finalize durable content jobs

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'feature/durable-content-jobs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/durable-content-jobs
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply final review fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def regex_once(path: str, pattern: str, replacement: str, label: str) -> None:
              file = Path(path)
              source = file.read_text()
              updated, count = re.subn(pattern, replacement, source, count=1, flags=re.S)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one match, found {count}')
              file.write_text(updated)

          sync_path = Path('src/lib/contentSync.ts')
          sync = sync_path.read_text()

          strict_validator = """function isIngestResult(value: unknown): value is IngestResult {
            if (!value || typeof value !== 'object') return false;
            const candidate = value as Partial<IngestResult>;
            const validMedia =
              Array.isArray(candidate.media) &&
              candidate.media.every((item) => {
                if (!item || typeof item !== 'object') return false;
                const media = item as Partial<ContentDraftMedia>;
                return (
                  typeof media.id === 'string' &&
                  media.id.trim().length > 0 &&
                  (media.technical_status === 'kept' ||
                    media.technical_status === 'background' ||
                    media.technical_status === 'rejected')
                );
              });
            return (
              validMedia &&
              typeof candidate.text_draft === 'string' &&
              candidate.text_draft.trim().length > 0 &&
              (candidate.visual_archetype === null || typeof candidate.visual_archetype === 'string') &&
              (candidate.text_triad === null ||
                (!!candidate.text_triad &&
                  typeof candidate.text_triad.opens === 'string' &&
                  typeof candidate.text_triad.leads === 'string' &&
                  typeof candidate.text_triad.closes === 'string'))
            );
          }

          """
          sync, count = re.subn(
              r"function isIngestResult\(value: unknown\): value is IngestResult \{.*?\n\}\n\n(?=export async function createContentIngestJob)",
              strict_validator,
              sync,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise RuntimeError(f'strict result validator: expected one match, found {count}')

          sync, count = re.subn(
              r"  if \(response\.status !== 202\) \{.*?\n  \}",
              "  if (response.status !== 202) {\n    throw new ContentSyncError(`POSTiNKA ответила ошибкой (${response.status}).`);\n  }",
              sync,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise RuntimeError(f'safe create error: expected one match, found {count}')

          old_job_check = "if (!data || typeof data.job_id !== 'string' || typeof data.status !== 'string')"
          if sync.count(old_job_check) != 1:
              raise RuntimeError(f'strict job id check: expected one match, found {sync.count(old_job_check)}')
          sync = sync.replace(old_job_check, "if (!data || data.job_id !== jobId || typeof data.status !== 'string')", 1)

          sync, count = re.subn(
              r"  if \(data\.status === 'failed'\) \{\n    return \{.*?\n    \};\n  \}",
              "  if (data.status === 'failed') {\n    return { status: 'failed', error: 'POSTiNKA не смогла собрать материал.' };\n  }",
              sync,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise RuntimeError(f'safe failed job error: expected one match, found {count}')
          sync_path.write_text(sync)

          queue_path = Path('src/lib/contentJobQueue.ts')
          queue = queue_path.read_text()

          helper = """function getContentEntryState(
            db: IDBDatabase,
            id: string,
          ): Promise<{ status?: unknown } | null> {
            return new Promise((resolve, reject) => {
              const tx = db.transaction(CONTENT_ENTRY_STORE, 'readonly');
              const request = tx.objectStore(CONTENT_ENTRY_STORE).get(id);
              request.onsuccess = () => resolve((request.result as { status?: unknown } | undefined) ?? null);
              request.onerror = () => reject(request.error ?? new Error('Failed to load content entry'));
            });
          }

          """
          helper_anchor = 'export async function putContentIngestJob'
          if 'function getContentEntryState(' not in queue:
              if queue.count(helper_anchor) != 1:
                  raise RuntimeError('content entry helper anchor changed')
              queue = queue.replace(helper_anchor, helper + helper_anchor, 1)

          old_process = """  const processJob = async (record: ContentIngestJobRecord) => {
            if (activeJobIds.has(record.id) || record.state === 'failed') return;
            activeJobIds.add(record.id);
            try {
              const status = await getContentIngestJob(record.jobId);
          """
          new_process = """  const processJob = async (record: ContentIngestJobRecord) => {
            if (activeJobIds.has(record.id)) return;
            activeJobIds.add(record.id);
            try {
              if (record.state === 'failed') {
                if (record.operation === 'refresh') {
                  const entry = await getContentEntryState(options.db, record.entryId);
                  if (!entry || entry.status !== 'draft') {
                    await deleteContentIngestJob(options.db, record.id);
                    options.onChanged();
                  }
                }
                return;
              }
              const status = await getContentIngestJob(record.jobId);
          """
          if queue.count(old_process) != 1:
              raise RuntimeError(f'failed refresh cleanup: expected one match, found {queue.count(old_process)}')
          queue = queue.replace(old_process, new_process, 1)

          old_retry = """        error: error instanceof Error ? error.message : 'Не удалось проверить задачу POSTiNKA.',
            retryable: false,
          """
          new_retry = """        error: error instanceof Error ? error.message : 'Не удалось проверить задачу POSTiNKA.',
            retryable: currentRecord.operation === 'create',
          """
          if queue.count(old_retry) != 1:
              raise RuntimeError(f'terminal create retryability: expected one match, found {queue.count(old_retry)}')
          queue = queue.replace(old_retry, new_retry, 1)
          queue_path.write_text(queue)

          tests = Path('tests/durableContentJobs.test.mjs')
          source = tests.read_text()
          import_anchor = "} from '../.test-dist/src/lib/contentJobQueue.js';\n"
          import_line = "import { ContentSyncError, createContentIngestJob, getContentIngestJob } from '../.test-dist/src/lib/contentSync.js';\n"
          if import_line not in source:
              if source.count(import_anchor) != 1:
                  raise RuntimeError('durable test import anchor changed')
              source = source.replace(import_anchor, import_anchor + import_line, 1)

          extra = r"""

          test('provider response bodies and backend failure details never reach the UI error', async () => {
            const settings = { enabled: true, endpoint: 'https://postinka.example', secret: 'secret' };
            await assert.rejects(
              createContentIngestJob(
                {
                  sessionId: 'session-1',
                  sourceType: 'freeform',
                  session: { client: '', zone: '', style: '', description: 'note' },
                  media: [],
                },
                {
                  readSettings: () => settings,
                  fetch: async () => ({ status: 500, text: async () => 'provider content-secret' }),
                },
              ),
              (error) =>
                error instanceof ContentSyncError &&
                error.message === 'POSTiNKA ответила ошибкой (500).' &&
                !error.message.includes('content-secret') &&
                !error.message.includes('provider'),
            );

            const failed = await getContentIngestJob('job-1', {
              readSettings: () => settings,
              fetch: async () => ({
                status: 200,
                ok: true,
                json: async () => ({ job_id: 'job-1', status: 'failed', error: 'provider content-secret' }),
              }),
            });
            assert.deepEqual(failed, { status: 'failed', error: 'POSTiNKA не смогла собрать материал.' });
          });

          test('completed jobs reject malformed media and mismatched job ids', async () => {
            const settings = { enabled: true, endpoint: 'https://postinka.example', secret: 'secret' };
            await assert.rejects(
              getContentIngestJob('job-1', {
                readSettings: () => settings,
                fetch: async () => ({
                  status: 200,
                  ok: true,
                  json: async () => ({
                    job_id: 'job-1',
                    status: 'completed',
                    result: {
                      media: [{ id: 'photo-1' }],
                      visual_archetype: null,
                      text_triad: null,
                      text_draft: 'Текст',
                    },
                  }),
                }),
              }),
              (error) => error instanceof ContentSyncError && error.message === 'POSTiNKA вернула повреждённый результат.',
            );

            await assert.rejects(
              getContentIngestJob('job-1', {
                readSettings: () => settings,
                fetch: async () => ({
                  status: 200,
                  ok: true,
                  json: async () => ({ job_id: 'job-other', status: 'running' }),
                }),
              }),
              (error) => error instanceof ContentSyncError && error.message === 'POSTiNKA вернула неожиданный ответ.',
            );
          });

          test('terminal create jobs stay retryable and failed refresh jobs are cleaned after confirmation', () => {
            const queue = readFileSync(new URL('../src/lib/contentJobQueue.ts', import.meta.url), 'utf8');
            assert.match(queue, /retryable: currentRecord\.operation === 'create'/);
            assert.match(queue, /record\.state === 'failed'[\s\S]*record\.operation === 'refresh'[\s\S]*entry\.status !== 'draft'/);
          });
          """
          if "provider response bodies and backend failure details never reach" not in source:
              source += extra
          tests.write_text(source)
          PY

      - name: Remove temporary workflow
        run: rm .github/workflows/finalize-durable-content-jobs.yml

      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: git diff --check

      - name: Commit final fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden durable POSTiNKA job recovery"
          git push origin HEAD:feature/durable-content-jobs
