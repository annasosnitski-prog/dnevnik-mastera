<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="384"
     height="64"
     viewBox="0 0 384 64"
     role="img"
     aria-labelledby="title desc">
  <title id="title">Gold rhombus navigation icons</title>
  <desc id="desc">Six gold rhombus medallions — pendant body and centre stone alike, both a rhombus cut, identical across all six tiles (previously a round medallion with a colour-coded round stone per tile; unified per Anna's direction).</desc>

  <view id="sessions" viewBox="0 0 64 64"/>
  <view id="consultations" viewBox="64 0 64 64"/>
  <view id="content" viewBox="128 0 64 64"/>
  <view id="notes" viewBox="192 0 64 64"/>
  <view id="info" viewBox="256 0 64 64"/>
  <view id="projects" viewBox="320 0 64 64"/>

  <defs>
    <!-- Exact metal language used by the main radial-toolbar button. -->
    <radialGradient id="gold-face" cx=".34" cy=".2" r=".84">
      <stop offset="0" stop-color="#FFF8D7"/>
      <stop offset=".14" stop-color="#FFD777"/>
      <stop offset=".34" stop-color="#B88B32"/>
      <stop offset=".56" stop-color="#793804"/>
      <stop offset=".76" stop-color="#E2B655"/>
      <stop offset=".91" stop-color="#7C5315"/>
      <stop offset="1" stop-color="#431A00"/>
    </radialGradient>
    <linearGradient id="plate-face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7E4B8"/>
      <stop offset=".35" stop-color="#D8A94A"/>
      <stop offset=".7" stop-color="#A3722A"/>
      <stop offset="1" stop-color="#6E4A16"/>
    </linearGradient>
    <linearGradient id="gold-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6B2C00"/>
      <stop offset=".16" stop-color="#FFF0B3"/>
      <stop offset=".35" stop-color="#9F772C"/>
      <stop offset=".55" stop-color="#FFD36E"/>
      <stop offset=".75" stop-color="#7D3603"/>
      <stop offset="1" stop-color="#E6BE68"/>
    </linearGradient>
    <radialGradient id="diamond-base" cx=".32" cy=".26" r=".75">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".32" stop-color="#F8FBFF"/>
      <stop offset=".63" stop-color="#CBD5DF"/>
      <stop offset=".82" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#929DAA"/>
    </radialGradient>
    <!-- The centre stone's own gold tone — same warm ratios as gold-face,
         just linear instead of radial since the stone is a flat rhombus,
         not a domed disc. -->
    <linearGradient id="rhombus-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF8D7"/>
      <stop offset=".4" stop-color="#FFD777"/>
      <stop offset="1" stop-color="#B88B32"/>
    </linearGradient>

    <filter id="medallion-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.1" result="blur"/>
      <feOffset in="blur" dy="1" result="off"/>
      <feComponentTransfer in="off" result="shadow">
        <feFuncA type="linear" slope=".45"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="stone-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.25"/>
    </filter>

    <g id="pave">
      <circle r="2" fill="#7D5A2A" opacity=".7"/>
      <circle r="1.5" fill="url(#diamond-base)" stroke="#FFFFFF" stroke-width=".22"/>
      <path d="M0-1.15.55-.35 0 0-.55-.35Z" fill="#FFFFFF" opacity=".95"/>
      <path d="M1.15 0 .45.55 0 0 .55-.35Z" fill="#C7D2DF" opacity=".9"/>
      <path d="M0 1.15-.45.42 0 0 .45.55Z" fill="#FFFFFF" opacity=".82"/>
      <path d="M-1.15 0-.55-.35 0 0-.45.42Z" fill="#AEB9C5" opacity=".9"/>
      <circle r=".28" fill="#FFFFFF" opacity=".9"/>
    </g>

    <!-- The 64px tile stays fixed. The visible gold body loses 16px of its
         diameter (one quarter of the tile): 58px becomes exactly 42px. The
         pendant itself is a rhombus now too (not just the centre stone, see
         centre-stone below) — every ring that used to be a circle at radius
         R is the same rhombus, vertices at 32±R along each axis. The eight
         pavé diamonds still ring the true outline: four sit on the sharp
         points (unchanged, they were already there), the other four moved
         off the old circle onto the rhombus edges' midpoints. -->
    <g id="gold-medallion">
      <g transform="translate(32 32) scale(.724138) translate(-32 -32)">
        <polygon points="32,3 61,32 32,61 3,32" fill="url(#gold-face)" stroke="#4B1A00" stroke-width=".7"/>
        <polygon points="32,4 60,32 32,60 4,32" fill="none" stroke="url(#gold-edge)" stroke-width=".95"/>
        <polygon points="32,7.5 56.5,32 32,56.5 7.5,32" fill="#2C0A00" stroke="#FFCF68" stroke-width=".8"/>
        <polygon points="32,8.35 55.65,32 32,55.65 8.35,32" fill="none" stroke="#6A2702" stroke-width=".4"/>
        <polygon points="32,9 55,32 32,55 9,32" fill="url(#plate-face)" stroke="#4B1A00" stroke-width=".5"/>
        <polygon points="32,12 52,32 32,52 12,32" fill="none" stroke="url(#gold-edge)" stroke-width=".5"/>
        <!-- The tube sits directly above the pendant. Its light lands on the
             upper crown as a soft gold wash with a narrower hot reflection. -->
        <path data-tube-reflection="ambient" d="M13.5 26 C20 12.5 44 12.5 50.5 26" fill="none" stroke="#FFD777" stroke-width="4.2" stroke-linecap="round" opacity=".15"/>
        <path data-tube-reflection="highlight" d="M16 23.5 C23 15.5 41 15.5 48 23.5" fill="none" stroke="#FFF8D7" stroke-width=".9" stroke-linecap="round" opacity=".78"/>
        <path d="M22 20 30 15" stroke="#FFF0B3" stroke-width="1.2" stroke-linecap="round" opacity=".4"/>

        <use href="#pave" xlink:href="#pave" transform="translate(32 5.2)"/>
        <use href="#pave" xlink:href="#pave" transform="translate(45.4 18.6)"/>
        <use href="#pave" xlink:href="#pave" transform="translate(58.8 32)"/>
        <use href="#pave" xlink:href="#pave" transform="translate(45.4 45.4)"/>
        <use href="#pave" xlink:href="#pave" transform="translate(32 58.8)"/>
        <use href="#pave" xlink:href="#pave" transform="translate(18.6 45.4)"/>
        <use href="#pave" xlink:href="#pave" transform="translate(5.2 32)"/>
        <use href="#pave" xlink:href="#pave" transform="translate(18.6 18.6)"/>
      </g>
    </g>

    <!-- The stone's own footprint is exactly 10.666666px across: 64px / 6 —
         a true rhombus silhouette now (four points, not a circle dressed up
         with diamond shading), so every tab shares one identical gold cut
         instead of a colour keyed off `color`/currentColor. -->
    <g id="centre-stone">
      <polygon points="32,25.85 38.15,32 32,38.15 25.85,32" fill="#2C0A00" stroke="url(#gold-edge)" stroke-width=".7"/>
      <polygon points="32,26.667 37.333,32 32,37.333 26.667,32" fill="url(#rhombus-gold)" opacity=".4" filter="url(#stone-glow)"/>
      <polygon points="32,26.667 37.333,32 32,37.333 26.667,32" fill="url(#rhombus-gold)" stroke="#160800" stroke-opacity=".7" stroke-width=".35"/>
      <path d="M32 26.667 37.333 32 32 32Z" fill="#FFFFFF" opacity=".34"/>
      <path d="M37.333 32 32 37.333 32 32Z" fill="#000000" opacity=".23"/>
      <path d="M32 37.333 26.667 32 32 32Z" fill="#000000" opacity=".38"/>
      <path d="M26.667 32 32 26.667 32 32Z" fill="#FFFFFF" opacity=".12"/>
      <circle cx="32" cy="32" r="2.25" fill="#FFFFFF" opacity=".1"/>
      <path d="M29.25 29.35 31.2 27.9" stroke="#FFFFFF" stroke-width=".75" stroke-linecap="round" opacity=".9"/>
      <polygon points="32,26.667 37.333,32 32,37.333 26.667,32" fill="none" stroke="#FFFFFF" stroke-opacity=".25" stroke-width=".25"/>
    </g>
  </defs>

  <g id="sessions-icon" filter="url(#medallion-shadow)">
    <use href="#gold-medallion" xlink:href="#gold-medallion"/>
    <use href="#centre-stone" xlink:href="#centre-stone"/>
  </g>
  <g id="consultations-icon" transform="translate(64 0)" filter="url(#medallion-shadow)">
    <use href="#gold-medallion" xlink:href="#gold-medallion"/>
    <use href="#centre-stone" xlink:href="#centre-stone"/>
  </g>
  <g id="content-icon" transform="translate(128 0)" filter="url(#medallion-shadow)">
    <use href="#gold-medallion" xlink:href="#gold-medallion"/>
    <use href="#centre-stone" xlink:href="#centre-stone"/>
  </g>
  <g id="notes-icon" transform="translate(192 0)" filter="url(#medallion-shadow)">
    <use href="#gold-medallion" xlink:href="#gold-medallion"/>
    <use href="#centre-stone" xlink:href="#centre-stone"/>
  </g>
  <g id="info-icon" transform="translate(256 0)" filter="url(#medallion-shadow)">
    <use href="#gold-medallion" xlink:href="#gold-medallion"/>
    <use href="#centre-stone" xlink:href="#centre-stone"/>
  </g>
  <g id="projects-icon" transform="translate(320 0)" filter="url(#medallion-shadow)">
    <use href="#gold-medallion" xlink:href="#gold-medallion"/>
    <use href="#centre-stone" xlink:href="#centre-stone"/>
  </g>
</svg>
