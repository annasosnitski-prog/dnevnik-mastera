<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="320" height="64" viewBox="0 0 320 64" role="img" aria-labelledby="title desc">
  <title id="title">Mineral client tab icons</title>
  <desc id="desc">Diamond-cut client tabs using the same section palette as the toolbar: malachite, moonstone, amethyst, tiger eye and garnet.</desc>

  <view id="sessions" viewBox="0 0 64 64"/>
  <view id="consultations" viewBox="64 0 64 64"/>
  <view id="content" viewBox="128 0 64 64"/>
  <view id="notes" viewBox="192 0 64 64"/>
  <view id="info" viewBox="256 0 64 64"/>

  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF0BD"/><stop offset=".24" stop-color="#C98C2F"/>
      <stop offset=".5" stop-color="#7D4A0E"/><stop offset=".72" stop-color="#F4C75D"/><stop offset="1" stop-color="#6E3C08"/>
    </linearGradient>
    <radialGradient id="diamond" cx=".3" cy=".25" r=".8">
      <stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#eef4f7"/><stop offset="1" stop-color="#aeb9c2"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation=".9" result="b"/><feOffset in="b" dy=".8" result="o"/>
      <feComponentTransfer in="o" result="s"><feFuncA type="linear" slope=".3"/></feComponentTransfer>
      <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <pattern id="malachite" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="#5CFF24"/>
      <ellipse cx="8" cy="9" rx="8" ry="5" fill="none" stroke="#0B6A22" stroke-width="2.2" opacity=".75"/>
      <ellipse cx="8" cy="9" rx="5" ry="3" fill="none" stroke="#D5FFBE" stroke-width="1.2" opacity=".5"/>
      <path d="M-2 3C4 8 10 0 20 7M-3 15C4 10 12 19 21 12" fill="none" stroke="#064B18" stroke-width="1.4" opacity=".7"/>
    </pattern>
    <radialGradient id="moonstone" cx=".38" cy=".32" r=".82">
      <stop offset="0" stop-color="#fff"/><stop offset=".34" stop-color="#dff9ff"/>
      <stop offset=".52" stop-color="#00CFFF" stop-opacity=".82"/><stop offset=".68" stop-color="#cfd9ff"/>
      <stop offset="1" stop-color="#7d9daa"/>
    </radialGradient>
    <radialGradient id="amethyst" cx=".35" cy=".25" r=".85">
      <stop offset="0" stop-color="#f4d8ff"/><stop offset=".34" stop-color="#C12FFF"/>
      <stop offset=".72" stop-color="#681493"/><stop offset="1" stop-color="#2f083e"/>
    </radialGradient>
    <linearGradient id="tiger" x1="0" y1="0" x2="1" y2=".25">
      <stop offset="0" stop-color="#4b2100"/><stop offset=".28" stop-color="#FF8900"/>
      <stop offset=".46" stop-color="#ffe29a"/><stop offset=".58" stop-color="#d66d00"/><stop offset="1" stop-color="#3a1800"/>
    </linearGradient>
    <radialGradient id="garnet" cx=".32" cy=".23" r=".9">
      <stop offset="0" stop-color="#ffadb5"/><stop offset=".25" stop-color="#FF3342"/>
      <stop offset=".62" stop-color="#8a0713"/><stop offset="1" stop-color="#260006"/>
    </radialGradient>

    <linearGradient id="facetLight" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".72"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="facetDark" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".46"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient>

    <g id="frame">
      <g transform="translate(32 32) rotate(45)">
        <rect x="-21" y="-21" width="42" height="42" rx="6" fill="url(#gold)" stroke="#5a3108" stroke-width="1"/>
        <rect x="-18.6" y="-18.6" width="37.2" height="37.2" rx="4.8" fill="#f8ead0" stroke="url(#gold)" stroke-width="1"/>
        <circle cx="-18.5" cy="-18.5" r="2" fill="url(#diamond)"/><circle cx="18.5" cy="-18.5" r="2" fill="url(#diamond)"/>
        <circle cx="18.5" cy="18.5" r="2" fill="url(#diamond)"/><circle cx="-18.5" cy="18.5" r="2" fill="url(#diamond)"/>
      </g>
    </g>

    <g id="facets">
      <path d="M32 13 51 32 32 27Z" fill="url(#facetLight)" opacity=".52"/>
      <path d="M51 32 32 51 37 32Z" fill="url(#facetDark)" opacity=".5"/>
      <path d="M32 51 13 32 32 37Z" fill="#000" opacity=".12"/>
      <path d="M13 32 32 13 27 32Z" fill="#fff" opacity=".16"/>
      <path d="M23 22 28 18" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity=".72"/>
    </g>
  </defs>

  <g id="sessions-icon" filter="url(#shadow)">
    <use href="#frame"/>
    <rect x="17" y="17" width="30" height="30" rx="4" transform="rotate(45 32 32)" fill="url(#malachite)" stroke="#0b4f1c" stroke-width=".7"/>
    <use href="#facets"/>
  </g>
  <g id="consultations-icon" transform="translate(64 0)" filter="url(#shadow)">
    <use href="#frame"/>
    <rect x="17" y="17" width="30" height="30" rx="4" transform="rotate(45 32 32)" fill="url(#moonstone)" stroke="#4a7889" stroke-width=".7"/>
    <use href="#facets"/>
  </g>
  <g id="content-icon" transform="translate(128 0)" filter="url(#shadow)">
    <use href="#frame"/>
    <rect x="17" y="17" width="30" height="30" rx="4" transform="rotate(45 32 32)" fill="url(#amethyst)" stroke="#4b0a68" stroke-width=".7"/>
    <use href="#facets"/>
  </g>
  <g id="notes-icon" transform="translate(192 0)" filter="url(#shadow)">
    <use href="#frame"/>
    <rect x="17" y="17" width="30" height="30" rx="4" transform="rotate(45 32 32)" fill="url(#tiger)" stroke="#5b2a00" stroke-width=".7"/>
    <use href="#facets"/>
  </g>
  <g id="info-icon" transform="translate(256 0)" filter="url(#shadow)">
    <use href="#frame"/>
    <rect x="17" y="17" width="30" height="30" rx="4" transform="rotate(45 32 32)" fill="url(#garnet)" stroke="#57040b" stroke-width=".7"/>
    <use href="#facets"/>
  </g>
</svg>
