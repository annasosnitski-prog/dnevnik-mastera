<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="320"
     height="64"
     viewBox="0 0 320 64"
     role="img"
     aria-labelledby="title desc">
  <title id="title">Glowing gemstone navigation icons</title>
  <desc id="desc">Green sessions, blue consultations, violet content, amber notes, and red info icons.</desc>

  <!--
    Text SVG sprite.
    Full strip: gem-icons.svg
    Individual views:
      gem-icons.svg#sessions
      gem-icons.svg#consultations
      gem-icons.svg#content
      gem-icons.svg#notes
      gem-icons.svg#info
  -->
  <view id="sessions" viewBox="0 0 64 64"/>
  <view id="consultations" viewBox="64 0 64 64"/>
  <view id="content" viewBox="128 0 64 64"/>
  <view id="notes" viewBox="192 0 64 64"/>
  <view id="info" viewBox="256 0 64 64"/>

  <defs>
    <filter id="glow-green" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.8" result="blur"/>
      <feFlood flood-color="#9FBD8B" flood-opacity=".68" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="halo"/>
      <feMerge><feMergeNode in="halo"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-blue" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.8" result="blur"/>
      <feFlood flood-color="#91B7D0" flood-opacity=".7" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="halo"/>
      <feMerge><feMergeNode in="halo"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-violet" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.8" result="blur"/>
      <feFlood flood-color="#B4A0CA" flood-opacity=".72" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="halo"/>
      <feMerge><feMergeNode in="halo"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-amber" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.8" result="blur"/>
      <feFlood flood-color="#D2B17B" flood-opacity=".7" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="halo"/>
      <feMerge><feMergeNode in="halo"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-red" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.8" result="blur"/>
      <feFlood flood-color="#D18A87" flood-opacity=".7" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="halo"/>
      <feMerge><feMergeNode in="halo"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- One shared simple square cut; color is supplied by each use instance. -->
    <g id="gem-cut">
      <path d="M14 10H50L54 14V50L50 54H14L10 50V14Z"
            fill="var(--gem-dark)" stroke="var(--gem-edge)" stroke-width="1.4"
            stroke-linejoin="round"/>
      <path d="M14 10H50L44 20H20Z" fill="var(--gem-light)"/>
      <path d="M50 10 54 14V50L44 44V20Z" fill="var(--gem-mid)"/>
      <path d="M54 50 50 54H14L20 44H44Z" fill="var(--gem-deep)"/>
      <path d="M14 54 10 50V14L20 20V44Z" fill="var(--gem-mid)"/>
      <rect x="20" y="20" width="24" height="24" rx="1"
            fill="var(--gem-core)" opacity=".88"/>
      <path d="M20 20 44 44M44 20 20 44"
            fill="none" stroke="var(--gem-line)" stroke-width=".65" opacity=".45"/>
      <path d="M23 23H31L27 27Z" fill="#FFFFFF" opacity=".92"/>
      <circle cx="27" cy="27" r="1.5" fill="#FFFFFF"/>
    </g>
  </defs>

  <g id="sessions-icon"
     style="--gem-dark:#314A27;--gem-deep:#486D39;--gem-mid:#5E8C4A;--gem-light:#9FBD8B;--gem-core:#E6EFDF;--gem-edge:#789F65;--gem-line:#C9DDBB"
     filter="url(#glow-green)">
    <use href="#gem-cut"/>
  </g>

  <g id="consultations-icon"
     transform="translate(64 0)"
     style="--gem-dark:#244A64;--gem-deep:#326789;--gem-mid:#3E7CA6;--gem-light:#91B7D0;--gem-core:#E2EDF4;--gem-edge:#6699BA;--gem-line:#C4D9E6"
     filter="url(#glow-blue)">
    <use href="#gem-cut"/>
  </g>

  <g id="content-icon"
     transform="translate(128 0)"
     style="--gem-dark:#49365F;--gem-deep:#62477E;--gem-mid:#7A5AA0;--gem-light:#B4A0CA;--gem-core:#EEE8F3;--gem-edge:#9478B1;--gem-line:#D5C8E1"
     filter="url(#glow-violet)">
    <use href="#gem-cut"/>
  </g>

  <g id="notes-icon"
     transform="translate(192 0)"
     style="--gem-dark:#63491F;--gem-deep:#8A672D;--gem-mid:#B48745;--gem-light:#D2B17B;--gem-core:#F4EBDD;--gem-edge:#C39C60;--gem-line:#E6D2AE"
     filter="url(#glow-amber)">
    <use href="#gem-cut"/>
  </g>

  <g id="info-icon"
     transform="translate(256 0)"
     style="--gem-dark:#682725;--gem-deep:#8E3532;--gem-mid:#B0413E;--gem-light:#D18A87;--gem-core:#F4E3E2;--gem-edge:#C66561;--gem-line:#E5B8B5"
     filter="url(#glow-red)">
    <use href="#gem-cut"/>
  </g>
</svg>
