<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="320"
     height="64"
     viewBox="0 0 320 64"
     role="img"
     aria-labelledby="title desc">
  <title id="title">Gold pendant navigation icons</title>
  <desc id="desc">A small gold pendant with a diamond halo and a coloured centre stone: green sessions, blue consultations, violet content, amber notes, and red info icons.</desc>

  <view id="sessions" viewBox="0 0 64 64"/>
  <view id="consultations" viewBox="64 0 64 64"/>
  <view id="content" viewBox="128 0 64 64"/>
  <view id="notes" viewBox="192 0 64 64"/>
  <view id="info" viewBox="256 0 64 64"/>

  <defs>
    <linearGradient id="gold-metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7E4B8"/>
      <stop offset=".35" stop-color="#D8A94A"/>
      <stop offset=".7" stop-color="#A3722A"/>
      <stop offset="1" stop-color="#6E4A16"/>
    </linearGradient>

    <radialGradient id="pave-diamond" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".55" stop-color="#EFF4F8"/>
      <stop offset="1" stop-color="#C3CFD8"/>
    </radialGradient>

    <!-- Cross-wise light/dark/light banding (not the diagonal gold-metal one)
         so the bail-to-frame connector reads as a round soldered rod instead
         of a flat stroked line. -->
    <linearGradient id="rod-metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6E4A16"/>
      <stop offset=".28" stop-color="#D8A94A"/>
      <stop offset=".5" stop-color="#F9EAC2"/>
      <stop offset=".72" stop-color="#D8A94A"/>
      <stop offset="1" stop-color="#6E4A16"/>
    </linearGradient>

    <!-- Hue-independent facet shading laid over each currentColor stone. -->
    <linearGradient id="stone-facet-highlight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".65"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".14"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="stone-facet-shadow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset=".5" stop-color="#000000" stop-opacity=".18"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".5"/>
    </linearGradient>

    <!-- Soft ambient shadow instead of a neon glow — reads as real metal, not a video-game gem. -->
    <filter id="pendant-shadow" x="-40%" y="-30%" width="180%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.1" result="blur"/>
      <feOffset in="blur" dy=".8" result="off"/>
      <feComponentTransfer in="off" result="shadow"><feFuncA type="linear" slope=".38"/></feComponentTransfer>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Colourless chrome: bail, gold diamond-shaped frame, pavé halo, prong beads. -->
    <g id="pendant-chrome">
      <circle cx="32" cy="9" r="2.8" fill="none" stroke="url(#gold-metal)" stroke-width="1.8"/>
      <rect x="31.05" y="11.3" width="1.9" height="5.4" rx=".95" fill="url(#rod-metal)" stroke="#5A3B10" stroke-width=".35"/>
      <line x1="31.5" y1="11.7" x2="31.5" y2="16" stroke="#FCEFD8" stroke-width=".4" stroke-linecap="round" opacity=".6"/>

      <g transform="translate(32 34) rotate(45)">
        <rect x="-12.5" y="-12.5" width="25" height="25" rx="3.2" fill="url(#gold-metal)" stroke="#5A3B10" stroke-width=".9"/>
        <rect x="-9.8" y="-9.8" width="19.6" height="19.6" rx="2.4" fill="#FCEFD8" stroke="url(#gold-metal)" stroke-width=".7"/>

        <circle cx="-9.8" cy="-9.8" r="1.7" fill="url(#pave-diamond)" stroke="#8B98A4" stroke-width=".35"/>
        <circle cx="9.8" cy="-9.8" r="1.7" fill="url(#pave-diamond)" stroke="#8B98A4" stroke-width=".35"/>
        <circle cx="9.8" cy="9.8" r="1.7" fill="url(#pave-diamond)" stroke="#8B98A4" stroke-width=".35"/>
        <circle cx="-9.8" cy="9.8" r="1.7" fill="url(#pave-diamond)" stroke="#8B98A4" stroke-width=".35"/>
        <circle cx="0" cy="-9.8" r="1.35" fill="url(#pave-diamond)" stroke="#8B98A4" stroke-width=".3"/>
        <circle cx="9.8" cy="0" r="1.35" fill="url(#pave-diamond)" stroke="#8B98A4" stroke-width=".3"/>
        <circle cx="0" cy="9.8" r="1.35" fill="url(#pave-diamond)" stroke="#8B98A4" stroke-width=".3"/>
        <circle cx="-9.8" cy="0" r="1.35" fill="url(#pave-diamond)" stroke="#8B98A4" stroke-width=".3"/>

        <circle cx="-12.5" cy="-12.5" r="1.25" fill="url(#gold-metal)" stroke="#5A3B10" stroke-width=".3"/>
        <circle cx="12.5" cy="-12.5" r="1.25" fill="url(#gold-metal)" stroke="#5A3B10" stroke-width=".3"/>
        <circle cx="12.5" cy="12.5" r="1.25" fill="url(#gold-metal)" stroke="#5A3B10" stroke-width=".3"/>
        <circle cx="-12.5" cy="12.5" r="1.25" fill="url(#gold-metal)" stroke="#5A3B10" stroke-width=".3"/>
      </g>
    </g>

    <!-- Coloured centre stone; recoloured per icon via currentColor. -->
    <g id="pendant-stone">
      <g transform="translate(32 34) rotate(45)">
        <rect x="-7.6" y="-7.6" width="15.2" height="15.2" rx="1.9" fill="#241608"/>
        <rect x="-7" y="-7" width="14" height="14" rx="1.8" fill="currentColor" stroke="#000000" stroke-opacity=".3" stroke-width=".4"/>
        <path d="M-7 -7 7 -7 -7 7Z" fill="url(#stone-facet-highlight)"/>
        <path d="M7 -7 7 7 -7 7Z" fill="url(#stone-facet-shadow)"/>
        <path d="M-4.3 -4.3 -1.2 -1.2" stroke="#FFFFFF" stroke-width=".9" stroke-linecap="round" opacity=".6"/>
      </g>
    </g>
  </defs>

  <g id="sessions-icon" filter="url(#pendant-shadow)">
    <use href="#pendant-chrome" xlink:href="#pendant-chrome"/>
    <use href="#pendant-stone" xlink:href="#pendant-stone" color="#72C83E"/>
  </g>
  <g id="consultations-icon" transform="translate(64 0)" filter="url(#pendant-shadow)">
    <use href="#pendant-chrome" xlink:href="#pendant-chrome"/>
    <use href="#pendant-stone" xlink:href="#pendant-stone" color="#319FD9"/>
  </g>
  <g id="content-icon" transform="translate(128 0)" filter="url(#pendant-shadow)">
    <use href="#pendant-chrome" xlink:href="#pendant-chrome"/>
    <use href="#pendant-stone" xlink:href="#pendant-stone" color="#A14ED8"/>
  </g>
  <g id="notes-icon" transform="translate(192 0)" filter="url(#pendant-shadow)">
    <use href="#pendant-chrome" xlink:href="#pendant-chrome"/>
    <use href="#pendant-stone" xlink:href="#pendant-stone" color="#D89A24"/>
  </g>
  <g id="info-icon" transform="translate(256 0)" filter="url(#pendant-shadow)">
    <use href="#pendant-chrome" xlink:href="#pendant-chrome"/>
    <use href="#pendant-stone" xlink:href="#pendant-stone" color="#D8402C"/>
  </g>
</svg>
